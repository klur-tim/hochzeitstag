<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Liebe ist Alles – Tim & Tobias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Caveat:wght@600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #f2eee2;
      font-family: 'Courier Prime', monospace;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-container {
      width: 100vw;
      height: 100dvh;
      max-width: 100%;
      max-height: 100%;
      position: relative;
      overflow: hidden;
      background: #f2eee2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-content {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* Paper Texture Overlay */
    .texture-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.22 0 0 0 0 0.19 0 0 0 0 0.14 0 0 0 0.06 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
      background-size: 240px 240px;
      background-repeat: repeat;
      z-index: 10;
    }

    /* Animations */
    @keyframes twinkle {
      0%, 100% {
        opacity: 0.15;
        transform: scale(0.6) rotate(0deg);
      }
      50% {
        opacity: 1;
        transform: scale(1.1) rotate(18deg);
      }
    }

    @keyframes riseFull {
      0% {
        transform: translateY(0) rotate(-10deg);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      85% {
        opacity: 0.35;
      }
      100% {
        transform: translateY(-940px) rotate(12deg);
        opacity: 0;
      }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes kissPop {
      0%, 20% {
        transform: scale(0);
        opacity: 0;
      }
      38% {
        transform: scale(1.25);
        opacity: 1;
      }
      52% {
        transform: scale(1);
      }
      78% {
        opacity: 1;
        transform: scale(1) translateY(-4px);
      }
      100% {
        transform: scale(0.7) translateY(-18px);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Main Content Layout */
    .content-wrapper {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      padding: clamp(36px, 7vw, 56px);
      z-index: 5;
    }

    /* Headline */
    .headline {
      animation: popIn 0.9s ease-out both;
      display: flex;
      flex-direction: column;
      line-height: 0.9;
    }

    .headline-title {
      font-family: 'Gaegu', cursive;
      font-weight: 700;
      font-size: clamp(56px, 16vw, 96px);
      color: #1c1c1c;
      line-height: 0.9;
    }

    .headline-subtitle {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-top: clamp(28px, 6vw, 44px);
      gap: clamp(8px, 2vw, 10px);
    }

    .names {
      font-family: 'Gaegu', cursive;
      font-weight: 700;
      font-size: clamp(28px, 7vw, 40px);
      line-height: 1;
      color: #1c1c1c;
    }

    .date {
      font-family: 'Courier Prime', monospace;
      font-size: clamp(11px, 3vw, 13px);
      letter-spacing: 1px;
      color: #1c1c1c;
    }

    .anniversary {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: clamp(20px, 5vw, 28px);
      color: #1c1c1c;
      transform: rotate(-1.5deg);
    }

    /* Illustration Container */
    .illustration-container {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: auto;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: visible;
      animation: popIn 1.1s 0.3s ease-out both;
    }

    .couple-svg {
      width: 100%;
      height: auto;
      max-width: 100%;
      display: block;
    }

    /* Rising Hearts */
    .rising-hearts-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .rising-heart {
      position: absolute;
      bottom: 0;
    }

    .rising-heart-1 { left: 9%; animation: riseFull 11s 0s linear infinite; }
    .rising-heart-2 { left: 26%; animation: riseFull 14s 3s linear infinite; }
    .rising-heart-3 { left: 58%; animation: riseFull 12s 6s linear infinite; }
    .rising-heart-4 { left: 76%; animation: riseFull 13s 1.5s linear infinite; }
    .rising-heart-5 { left: 42%; animation: riseFull 15s 8s linear infinite; }
    .rising-heart-6 { left: 88%; animation: riseFull 10s 4.5s linear infinite; }

    .heart-icon {
      width: clamp(10px, 2vw, 18px);
      height: auto;
      display: block;
    }

    /* Decorative elements over couple */
    .kiss-heart {
      position: absolute;
      left: 50%;
      top: 14%;
      transform: translateX(-50%);
      animation: kissPop 3s ease-in-out infinite;
      z-index: 3;
    }

    .star-left {
      position: absolute;
      left: 24%;
      top: 6%;
      animation: twinkle 2.4s 0.5s ease-in-out infinite;
      z-index: 3;
    }

    .star-right {
      position: absolute;
      left: 74%;
      top: 2%;
      animation: twinkle 2.8s 1.2s ease-in-out infinite;
      z-index: 3;
    }

    /* Hidden Spotify Player */
    .music-player {
      position: fixed;
      bottom: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }

    /* Responsive adjustments */
    @media (max-height: 600px) {
      .headline-subtitle {
        margin-top: 20px;
      }
    }

    @media (orientation: landscape) {
      .content-wrapper {
        padding: clamp(24px, 5vh, 40px);
      }

      .headline-subtitle {
        margin-top: clamp(16px, 3vh, 28px);
      }
    }
  </style>
</head>
<body>
  <div class="hero-container">
    <div class="hero-content">
      <!-- Paper Texture -->
      <div class="texture-overlay"></div>

      <!-- Rising Hearts -->
      <div class="rising-hearts-container">
        <div class="rising-heart rising-heart-1">
          <svg viewBox="0 0 24 24" class="heart-icon"><path d="M12 21 C5 15 2 11 2 7.5 C2 4.5 4.5 2 7.5 2 C9.5 2 11 3 12 4.5 C13 3 14.5 2 16.5 2 C19.5 2 22 4.5 22 7.5 C22 11 19 15 12 21 Z" fill="oklch(0.6 0.17 25)"></path></svg>
        </div>
        <div class="rising-heart rising-heart-2">
          <svg viewBox="0 0 24 24" class="heart-icon"><path d="M12 21 C5 15 2 11 2 7.5 C2 4.5 4.5 2 7.5 2 C9.5 2 11 3 12 4.5 C13 3 14.5 2 16.5 2 C19.5 2 22 4.5 22 7.5 C22 11 19 15 12 21 Z" fill="#1c1c1c"></path></svg>
        </div>
        <div class="rising-heart rising-heart-3">
          <svg viewBox="0 0 24 24" class="heart-icon"><path d="M12 21 C5 15 2 11 2 7.5 C2 4.5 4.5 2 7.5 2 C9.5 2 11 3 12 4.5 C13 3 14.5 2 16.5 2 C19.5 2 22 4.5 22 7.5 C22 11 19 15 12 21 Z" fill="oklch(0.6 0.17 25)"></path></svg>
        </div>
        <div class="rising-heart rising-heart-4">
          <svg viewBox="0 0 24 24" class="heart-icon"><path d="M12 21 C5 15 2 11 2 7.5 C2 4.5 4.5 2 7.5 2 C9.5 2 11 3 12 4.5 C13 3 14.5 2 16.5 2 C19.5 2 22 4.5 22 7.5 C22 11 19 15 12 21 Z" fill="#1c1c1c"></path></svg>
        </div>
        <div class="rising-heart rising-heart-5">
          <svg viewBox="0 0 24 24" class="heart-icon"><path d="M12 21 C5 15 2 11 2 7.5 C2 4.5 4.5 2 7.5 2 C9.5 2 11 3 12 4.5 C13 3 14.5 2 16.5 2 C19.5 2 22 4.5 22 7.5 C22 11 19 15 12 21 Z" fill="oklch(0.6 0.17 25)"></path></svg>
        </div>
        <div class="rising-heart rising-heart-6">
          <svg viewBox="0 0 24 24" class="heart-icon"><path d="M12 21 C5 15 2 11 2 7.5 C2 4.5 4.5 2 7.5 2 C9.5 2 11 3 12 4.5 C13 3 14.5 2 16.5 2 C19.5 2 22 4.5 22 7.5 C22 11 19 15 12 21 Z" fill="#1c1c1c"></path></svg>
        </div>
      </div>

      <!-- Main Content -->
      <div class="content-wrapper">
        <!-- Headline -->
        <div class="headline">
          <div class="headline-title">LIEBE</div>
          <div class="headline-title">IST</div>
          <div class="headline-title">ALLES</div>
          <div class="headline-subtitle">
            <div class="names">TIM & TOBIAS</div>
            <div class="date">Verheiratet seit dem 12. August 2023</div>
            <div class="anniversary">3 Jahre & für immer!</div>
          </div>
        </div>
      </div>

      <!-- Illustration -->
      <div class="illustration-container">
        <svg viewBox="0 0 340 260" class="couple-svg" fill="none" stroke="#1c1c1c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <!-- dark groom (filled), behind -->
          <path d="M182 160 Q172 210 174 262 L252 262 Q256 205 246 156 Q232 144 214 144 Q196 144 182 160 Z" fill="#1c1c1c"></path>
          <path d="M186 164 Q158 158 144 172" stroke-width="10"></path>
          <path d="M200 150 L211 178 L223 150 Q217 144 211 144 Q205 144 200 150 Z" fill="#f2eee2"></path>
          <path d="M211 156 L201 151 L201 162 Z M211 156 L221 151 L221 162 Z" fill="#1c1c1c" stroke-width="1.5"></path>
          <circle cx="210" cy="110" r="34" fill="#f2eee2"></circle>
          <path d="M177 110 Q175 76 210 72 Q245 76 244 108 Q236 88 221 86 Q203 84 192 98 Q181 102 177 110 Z" fill="#1c1c1c"></path>
          <path d="M216 112 Q220 116 224 112"></path>
          <path d="M232 112 Q236 116 240 112"></path>
          <path d="M220 128 Q228 136 236 127"></path>
          <path d="M196 122 L203 120 M196 128 L203 126" stroke-width="1.8"></path>
          <!-- blond groom kissing (outline), in front -->
          <path d="M116 158 Q106 202 108 262 L176 262 Q180 202 170 154 Q158 144 143 144 Q128 144 116 158 Z" fill="#f2eee2"></path>
          <path d="M133 148 L143 170 L153 148"></path>
          <path d="M143 152 L132 147 L132 158 Z M143 152 L154 147 L154 158 Z" fill="#1c1c1c" stroke-width="1.5"></path>
          <path d="M166 162 Q186 154 194 144"></path>
          <circle cx="196" cy="142" r="4.5" fill="#f2eee2"></circle>
          <circle cx="142" cy="118" r="30" fill="#f2eee2"></circle>
          <path d="M114 112 Q114 86 142 84 Q166 86 170 106"></path>
          <path d="M124 98 Q132 90 142 92"></path>
          <path d="M142 92 Q152 88 160 96"></path>
          <path d="M118 106 Q123 101 123 110"></path>
          <path d="M126 118 Q130 121 134 118"></path>
          <path d="M146 118 Q150 121 154 118"></path>
          <path d="M168 112 Q174 114 168 117 Q174 120 168 122" stroke-width="2"></path>
          <circle cx="123" cy="126" r="1.3" fill="#1c1c1c" stroke="none"></circle>
          <circle cx="133" cy="128" r="1.3" fill="#1c1c1c" stroke="none"></circle>
        </svg>

        <!-- Kiss Heart -->
        <div class="kiss-heart">
          <svg viewBox="0 0 24 24" style="width: clamp(16px, 3vw, 20px); height: auto;"><path d="M12 21 C5 15 2 11 2 7.5 C2 4.5 4.5 2 7.5 2 C9.5 2 11 3 12 4.5 C13 3 14.5 2 16.5 2 C19.5 2 22 4.5 22 7.5 C22 11 19 15 12 21 Z" fill="oklch(0.6 0.17 25)"></path></svg>
        </div>

        <!-- Stars -->
        <div class="star-left">
          <svg viewBox="0 0 24 24" style="width: clamp(14px, 2.5vw, 16px); height: auto;"><path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="#1c1c1c"></path></svg>
        </div>
        <div class="star-right">
          <svg viewBox="0 0 24 24" style="width: clamp(11px, 2vw, 13px); height: auto;"><path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="#1c1c1c"></path></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden Spotify Player (using iframe embed) -->
  <div class="music-player">
    <iframe src="https://open.spotify.com/embed/track/5f6EUmXVbWx4zEEHs3fKVc?utm_source=generator&autoplay=1" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
  </div>

  <!-- Fallback Audio with YouTube video (in case Spotify doesn't autoplay) -->
  <audio autoplay loop style="display: none;">
    <source src="https://www.youtube.com/watch?v=qO3jHKUhkAM" type="audio/mpeg">
  </audio>

  <script>
    // Ensure smooth full-height experience
    document.documentElement.style.height = '100vh';
    document.documentElement.style.height = '100dvh';

    // Attempt to play background music
    window.addEventListener('load', () => {
      const audio = document.querySelector('audio');
      if (audio) {
        audio.play().catch(error => {
          console.log('Autoplay prevented:', error);
          // User interaction might be needed
          document.addEventListener('click', () => {
            audio.play().catch(err => console.log('Play failed:', err));
          }, { once: true });
        });
      }
    });

    // Handle viewport changes
    window.addEventListener('orientationchange', () => {
      document.documentElement.style.height = '100dvh';
    });

    // Prevent zoom
    document.addEventListener('touchmove', (e) => {
      if (e.scale !== 1) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>
</body>
</html>
